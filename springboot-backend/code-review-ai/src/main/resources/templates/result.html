<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Upload Result</title>

<style>

body{
    font-family:Arial;
    background:#f4f4f4;
    text-align:center;
}

.card{
    width:700px;
    margin:80px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0px 0px 10px lightgray;
}

h1{
    color:green;
}

a{
    text-decoration:none;
    font-size:20px;
}

</style>

</head>

<body>

<div class="card">

<h1 th:text="${message}"></h1>

<h2 th:text="${fileName}"></h2>

<p>
    Language:
    <strong th:text="${language}"></strong>
</p>

<div th:if="${errors != null and !errors.isEmpty()}">
    <h3>Validation Issues</h3>
    <ul style="display:inline-block;text-align:left;">
        <li th:each="error : ${errors}" th:text="${error}"></li>
    </ul>
</div>

<pre style="text-align:left;background:#111827;color:#d1fae5;padding:18px;border-radius:8px;overflow:auto;max-height:420px;" th:text="${code}"></pre>

<br>

<a href="/">Upload Another File</a>

</div>

</body>

</html>
