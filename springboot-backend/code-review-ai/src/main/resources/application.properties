spring.application.name=code-review-ai
server.port=8080
ai.service.base-url=http://127.0.0.1:8000
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
app.upload-dir=${UPLOAD_DIR:uploads}

# Docker Compose supplies MySQL configuration. H2 remains a safe local fallback.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/code-review;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

