spring.application.name=code-review-ai
server.port=8080
spring.servlet.multipart.max-file-size=256KB
spring.servlet.multipart.max-request-size=256KB
ai.service.base-url=http://127.0.0.1:8000
server.port=8080
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
# Use external drive to avoid filling C:
# Change path as needed (E: or D: preferred)
app.upload-dir=${UPLOAD_DIR:uploads}

# Set DB_URL, DB_USERNAME and DB_PASSWORD for MySQL, for example:
# DB_URL=jdbc:mysql://localhost:3306/code_review_ai?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/code-review;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
