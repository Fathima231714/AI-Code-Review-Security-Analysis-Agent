services:
  mysql:
    profiles: ["mysql"]
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: code_review_ai
      MYSQL_USER: code_review
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  ai-service:
    build: ./ai-service
    environment:
      KB_DIR: /workspace/knowledge-base
      CHROMA_DIR: /workspace/chroma
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/api/generate}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
    volumes:
      - ./knowledge-base:/workspace/knowledge-base:ro
      - chroma_data:/workspace/chroma
    ports:
      - "8000:8000"

  backend:
    build: ./springboot-backend/code-review-ai
    environment:
      # Use the application's embedded persistent database by default. This
      # avoids a failed MySQL login preventing the whole review UI from
      # starting. Enable the optional mysql profile only when external MySQL
      # persistence is required.
      DB_URL: jdbc:h2:file:/workspace/data/code-review;MODE=MySQL
      DB_USERNAME: sa
      DB_PASSWORD: ""
      DB_DRIVER: org.h2.Driver
      AI_SERVICE_BASE_URL: http://ai-service:8000
      UPLOAD_DIR: /workspace/uploads
    depends_on:
      ai-service:
        condition: service_started
    volumes:
      - uploads_data:/workspace/uploads
      - backend_data:/workspace/data
    ports:
      - "8080:8080"

  frontend:
    build: ./react-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
  chroma_data:
  uploads_data:
  backend_data:
