server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Reviews are handled by the FastAPI multi-agent service. Keeping this
  # route also supports clients that still have an older frontend bundle.
  location = /api/review {
    proxy_pass http://ai-service:8000/review;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location = /api/ask {
    proxy_pass http://ai-service:8000/ask;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location = /api/reports/html {
    proxy_pass http://ai-service:8000/reports/html;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location = /api/reports/pdf {
    proxy_pass http://ai-service:8000/reports/pdf;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / { try_files $uri $uri/ /index.html; }
}
